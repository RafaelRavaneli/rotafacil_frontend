[32m+[m[32m## Preparação automática da configuração Web[m
[32m+[m
[32m+[m[32mO script `CONFIGURAR_FIREBASE_WEB.ps1` agora recebe também `-WebVapidKey` e gera tanto o service worker quanto `firebase-web.local.json`, evitando configurar projetos diferentes no Flutter e no worker. Execute no PowerShell usando os valores públicos do Firebase Console:[m
[32m+[m
[32m+[m[32m```powershell[m
[32m+[m[32m.\CONFIGURAR_FIREBASE_WEB.ps1 -ApiKey 'VALOR_PUBLICO' -AuthDomain 'DOMINIO' -ProjectId 'PROJETO' -StorageBucket 'BUCKET' -MessagingSenderId 'REMETENTE' -AppId 'APP_ID' -WebVapidKey 'VAPID_PUBLICA'[m
[32m+[m[32mflutter run -d chrome --web-port=8080 --dart-define-from-file=firebase-web.local.json[m
[32m+[m[32m```[m
[32m+[m
[32m+[m[32mO arquivo gerado inclui `USE_BACKEND=true` e o endereço local da API. Configure `-ApiBaseUrl` para usar outro endereço. Reinicie o Flutter após mudar os valores. O JSON é configuração pública do cliente, nunca uma chave de conta de serviço; não coloque chaves privadas nesses arquivos. O JSON local e o worker gerado ficam ignorados pelo Git.[m
[32m+[m
[32m+[m[32mPara testar: faça login, abra Perfil → Notificações, ative a permissão e use “Testar recebimento de notificação”. O retorno da API conta envios aceitos pelo FCM, não confirma entrega. Confira o recebimento com a aba em foco e em segundo plano. O exemplo do worker evita exibir duas vezes mensagens que já contêm `notification`, seguindo o [contrato do Firebase](https://firebase.google.com/docs/cloud-messaging/web/receive-messages).[m
[32m+[m
[32m+[m[32mValidação real ainda pendente. Registro, rotação, remoção e envio simulado estão cobertos por testes. Nenhum envio automático para eventos de reserva/chat está ativado.[m
