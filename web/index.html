<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RotaFácil - Trilhas e aventuras.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RotaFácil">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RotaFácil</title>
  <meta name="theme-color" content="#2F4A1E">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FFFEF9; }
    /* Tela de carregamento: aparece enquanto o Flutter inicia e some no primeiro quadro. */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; background: #FFFEF9; transition: opacity .3s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 132px; height: 132px; }
    #splash .spinner {
      width: 28px; height: 28px; border: 3px solid #EAEFDD; border-top-color: #4F672B;
      border-radius: 50%; animation: splash-spin .9s linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .spinner { animation-duration: 3s; } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="splash" role="status" aria-live="polite" aria-label="Carregando RotaFácil">
    <img src="icons/Icon-192.png" alt="RotaFácil">
    <div class="spinner" aria-hidden="true"></div>
  </div>
  <script>
    (function () {
      var done = false;
      function hideSplash() {
        if (done) return;
        done = true;
        var el = document.getElementById('splash');
        if (!el) return;
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 350);
      }
      window.addEventListener('flutter-first-frame', hideSplash);
      document.addEventListener('flutter-first-frame', hideSplash);
      // Rede de segurança: nunca deixa a tela de carregamento cobrindo o app.
      setTimeout(hideSplash, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
